# Configuración del Script de Mantenimiento de Jenkins
# Este archivo permite personalizar las rutas y parámetros del script
# 
# Para usar este archivo, expórtelo antes de ejecutar el script:
#   source jenkins_maintenance.conf
#   sudo -E ./jenkins_maintenance.sh
#
# O pase las variables directamente:
#   sudo JENKINS_HOME=/opt/jenkins ./jenkins_maintenance.sh

# Ruta del directorio home de Jenkins
JENKINS_HOME=/var/lib/jenkins

# Directorio donde se almacenarán los backups
BACKUP_DIR=/var/backups/jenkins

# Nombre del servicio Jenkins (puede variar según la instalación)
JENKINS_SERVICE=jenkins

# Número máximo de backups a mantener (se mantienen solo los más recientes)
MAX_BACKUPS=1

# Archivo de log para el script
LOG_FILE=/var/log/jenkins_maintenance.log

# Habilitar eliminación de workspaces (PRECAUCIÓN: puede causar pérdida de datos)
# CLEANUP_WORKSPACES=false

# Continuar sin backup si falla (NO RECOMENDADO)
# SKIP_BACKUP_ON_ERROR=false
